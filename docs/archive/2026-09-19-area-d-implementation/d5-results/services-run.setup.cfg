[mutmut]
source_paths = app/services/run_state.py
   app/services/single_job_runner.py
   app/services/batch_orchestrator.py
   app/services/multi_page_dispatcher.py
mutate_only_covered_lines = true
timeout_multiplier = 12
timeout_constant = 10
also_copy = app
            tests
            tools
            pytest.ini
pytest_add_cli_args_test_selection = tests/test_run_state.py
   tests/test_single_job_runner.py
   tests/test_batch_orchestrator.py
   tests/test_multi_page_dispatcher.py
   tests/test_multi_page_dispatcher_run.py
