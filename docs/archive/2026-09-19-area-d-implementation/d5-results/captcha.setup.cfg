[mutmut]
source_paths = app/services/captcha
mutate_only_covered_lines = true
timeout_multiplier = 12
timeout_constant = 10
also_copy = app
            tests
            tools
            pytest.ini
pytest_add_cli_args_test_selection = tests/test_captcha_solver.py
   tests/test_captcha_service.py
   tests/test_captcha_api_client.py
   tests/test_captcha_boundaries.py
   tests/test_captcha_recovery.py
   tests/test_captcha_stats.py
   tests/test_captcha_key_store.py
   tests/test_captcha_job_lines.py
   tests/test_captcha_pure_full.py
