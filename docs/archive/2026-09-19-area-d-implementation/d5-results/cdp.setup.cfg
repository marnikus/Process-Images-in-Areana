[mutmut]
source_paths = app/browser/cdp_client.py
   app/browser/cdp_arena.py
   app/browser/cdp_events.py
   app/browser/cdp_protocol.py
mutate_only_covered_lines = true
timeout_multiplier = 12
timeout_constant = 10
also_copy = app
            tests
            tools
            pytest.ini
pytest_add_cli_args_test_selection = tests/test_cdp_client.py
   tests/test_cdp_arena.py
   tests/test_cdp_arena_submit.py
   tests/test_cdp_events.py
   tests/test_page_pool.py
   tests/test_output_wait_state.py
   tests/test_panel_browser_tabs.py
