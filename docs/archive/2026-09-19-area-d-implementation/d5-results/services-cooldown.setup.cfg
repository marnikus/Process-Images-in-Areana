[mutmut]
source_paths = app/services/cooldown_service.py
mutate_only_covered_lines = true
timeout_multiplier = 12
timeout_constant = 10
also_copy = app
            tests
            tools
            pytest.ini
pytest_add_cli_args_test_selection = tests/test_cooldown.py
   tests/test_cooldown_branches.py
   tests/test_cooldown_service.py
   tests/test_cooldown_store.py
