# Reference CI workflow for Arena — 3-stage pipeline (Phase 4+7)
# Due to GitHub App permission, this file is kept as reference in docs/archive,
# not in .github/workflows/. To enable, copy to .github/workflows/test.yml manually
# with workflows permission.

name: Arena Tests — 3-stage pipeline (Phase 4+7)

on:
  push:
    branches: [main, arena/*]
  pull_request:
    branches: [main]

jobs:
  gate1-lint-unit:
    name: Gate 1 — Lint + Unit (<10s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check app/ || true
      - name: Quality gate (changed files)
        run: python tools/verify_quality.py --changed --allow-legacy
      - name: Unit tests fast lane (parallel)
        run: pytest -n auto -m "unit" -q --durations=10

  gate2-integration:
    name: Gate 2 — Integration (<30s)
    runs-on: ubuntu-latest
    needs: gate1-lint-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Integration tests (parallel)
        run: pytest -n auto -m "integration and not slow and not e2e" -q --durations=10
      - name: JS Tier A logic tests (Node, no browser, ~50ms)
        run: |
          npm install --silent || true
          npm run test:js || node --test tests/js/test_sash_core.mjs tests/js/test_sash_grid_tree.mjs || echo "JS tests skipped"

  gate3-e2e-smoke:
    name: Gate 3 — E2E Smoke (<60s, serial)
    runs-on: ubuntu-latest
    needs: gate2-integration
    if: github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[e2e]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: E2E smoke (serial, slow)
        run: pytest -n 0 -m "slow or e2e" -q --durations=10
