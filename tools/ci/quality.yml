name: Image Queue quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev,desktop]"
      - run: npm ci --ignore-scripts
      - run: python tools/check.py
  desktop:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      # CI renderer only. Never applied to the user's debug Chrome or production launcher.
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu --disable-dev-shm-usage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libnss3 libdbus-1-3 libxkbcommon0 libasound2t64
      - run: python -m pip install -e ".[dev,desktop]"
      - run: python -m coverage run -m pytest
      - run: python -m coverage run --append tools/desktop_smoke.py
      - run: python -m coverage report --fail-under=90
      - run: python -m coverage report --include="*/image_queue/desktop/*" --fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke
          path: coverage/workspace.png
