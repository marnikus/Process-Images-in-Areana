[pytest]
testpaths = tests
asyncio_mode = auto
markers =
    unit: pure logic <10ms, no I/O
    integration: touches FS or mock WS, <100ms
    e2e: real Chrome/Qt, slow
    slow: >1s
    serial: must run serially, not with xdist
addopts = --durations=10 --strict-markers
# For parallel run (Phase 4):
#   pytest -n auto -m "not slow and not e2e"  -> fast lane, <5s on 4 cores
#   pytest -n 0 -m "slow or e2e"              -> slow lane, serial
# xdist group: --dist loadgroup keeps slow tests together if needed
