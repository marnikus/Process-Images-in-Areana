[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-image-queue"
version = "0.1.0"
description = "Local image queue — offline foundation for the retained desktop workspace"
requires-python = ">=3.11"
dependencies = ["filelock==3.18.0", "platformdirs==4.3.8"]

[project.optional-dependencies]
desktop = ["PySide6==6.8.3"]
dev = [
  "pytest==8.3.5", "pytest-cov==6.0.0", "ruff==0.11.13", "mypy==1.15.0",
  "radon==6.0.1", "cognitive-complexity==1.3.0",
]

[project.scripts]
image-queue = "image_queue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/image_queue"]

[tool.coverage.run]
branch = true
source = ["image_queue"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.setuptools.package-data]
image_queue = ["ui/*.html", "ui/*.json", "ui/css/*.css", "ui/js/*.js", "ui/js/core/*.js"]
